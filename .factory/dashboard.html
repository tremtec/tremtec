<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software factory</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Look borrowed from Fizzy (37signals): pale canvas, navy ink, lanes that
     collapse into colour pills, paper cards, golden tickets for what needs you. */
  :root {
    color-scheme: light dark;
    --bg: oklch(97.89% 0.0029 264.54);
    --panel: oklch(99.89% 0.0029 264.54);
    --card: #fff;
    --card-hover: oklch(98.4% 0.005 264);
    --line: oklch(92% 0.003 254);
    --line-strong: oklch(84% 0.005 256);
    --text: oklch(26% 0.05 264);
    --muted: oklch(46% 0.03 262);
    --faint: oklch(62% 0.012 258);
    --link: oklch(57.02% 0.1895 260.46);
    --active: oklch(55.5% 0.122 210);
    --pass: oklch(50% 0.162 147);
    --changes: oklch(53% 0.14 60);
    --human: oklch(56% 0.19 32);
    --merged: oklch(58% 0.216 287.6);
    --gold: oklch(74% 0.184 70);
    --gold-soft: oklch(96.5% 0.034 100);
    --gold-mid: oklch(92% 0.076 90);
    --c-discovery: oklch(66% 0.206 285.52);
    --c-prototype: oklch(70% 0.17 55);
    --c-spec: oklch(71.8% 0.2008 342);
    --c-build: oklch(66% 0.152 208);
    --c-review: oklch(68% 0.176 113.11);
    --c-team: oklch(66% 0.196 257.82);
    --c-merged: oklch(74% 0.008 258);
    --pill-top: 100%; --pill-mid: 55%; --pill-end: 14%;
    --shadow: 0 1px 2px oklch(26% 0.05 264 / .08), 0 6px 16px -8px oklch(26% 0.05 264 / .18);
    --display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(19% 0.02 264);
      --panel: oklch(22.5% 0.024 264);
      --card: oklch(26% 0.028 264);
      --card-hover: oklch(29% 0.03 264);
      --line: oklch(33% 0.025 264);
      --line-strong: oklch(43% 0.025 264);
      --text: oklch(96% 0.002 252);
      --muted: oklch(80% 0.012 258);
      --faint: oklch(63% 0.014 258);
      --link: oklch(76% 0.13 257);
      --active: oklch(80% 0.1 208);
      --pass: oklch(80% 0.17 147);
      --changes: oklch(82% 0.14 78);
      --human: oklch(74% 0.17 32);
      --merged: oklch(76% 0.14 286);
      --gold: oklch(80% 0.16 82);
      --gold-soft: oklch(29% 0.035 90);
      --gold-mid: oklch(35% 0.065 86);
      --c-merged: oklch(56% 0.012 258);
      --pill-top: 62%; --pill-mid: 40%; --pill-end: 14%;
      --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 8px 18px -8px oklch(0% 0 0 / .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 18px 32px 4px;
  }
  h1 {
    margin: 0; display: flex; align-items: center; gap: 10px;
    font: 700 19px/1 var(--display); letter-spacing: -0.01em;
  }
  /* The mark is live: one bar per pipeline lane, as tall as its job count. */
  .bars {
    display: inline-flex; align-items: flex-end; gap: 2.5px; height: 30px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
  }
  .bars i { width: 3.5px; border-radius: 2px; background: var(--c); height: var(--h); min-height: 3px; }
  .status {
    font: 600 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 0;
  }
  .status.error { color: var(--human); text-transform: none; letter-spacing: 0; }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 10px 32px 0; padding: 9px 14px; border: 1px solid var(--human);
    border-radius: 6px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Board: lanes side by side, scrolling inside */
  .board {
    flex: 1 1 0; min-height: 0; overflow: auto; padding: 18px 32px 20px; margin-bottom: 14px;
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
  }
  .board::-webkit-scrollbar, .so-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .board::-webkit-scrollbar-thumb, .so-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
  .board::-webkit-scrollbar-thumb:hover, .so-body::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  .board::-webkit-scrollbar-track, .so-body::-webkit-scrollbar-track, .board::-webkit-scrollbar-corner { background: transparent; }
  .lanes {
    display: flex; gap: 14px; align-items: stretch; width: max-content; min-height: 100%; margin: 0 auto;
  }
  .c-discovery { --c: var(--c-discovery); } .c-prototype { --c: var(--c-prototype); } .c-spec { --c: var(--c-spec); } .c-build { --c: var(--c-build); }
  .c-review { --c: var(--c-review); } .c-team { --c: var(--c-team); } .c-merged, .c-discarded { --c: var(--c-merged); }

  /* A collapsed lane: a pill as long as its job count, then a thread down the board */
  .pillcol { flex: none; width: 38px; display: flex; flex-direction: column; align-items: center; }
  .pill {
    flex: none; width: 38px; min-height: calc(142px + var(--n) * 30px); padding: 11px 0 16px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border: 0; border-radius: 19px; cursor: pointer; color: var(--text);
    background: linear-gradient(to bottom,
      color-mix(in oklab, var(--c) var(--pill-top), transparent),
      color-mix(in oklab, var(--c) var(--pill-mid), transparent) 46%,
      color-mix(in oklab, var(--c) var(--pill-end), transparent));
    transition: transform .12s, filter .12s;
  }
  .pill:hover { transform: translateY(-2px); filter: saturate(1.15); }
  .pill:focus-visible, .col-head:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  .pill .n { font: 700 14px/1 var(--display); }
  .pill .name {
    writing-mode: vertical-rl; white-space: nowrap;
    font: 700 11.5px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
  }
  .pill.none { opacity: .55; }
  .thread { flex: 1; width: 1px; min-height: 16px; background: color-mix(in oklab, var(--c) 45%, transparent); }

  /* An open lane */
  .col { flex: none; width: 336px; display: flex; flex-direction: column; }
  .col.you { width: 400px; }
  .col.just { animation: lane-in .18s ease-out; transform-origin: left top; }
  .col-head {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin: 0 0 12px; padding: 2px 0 0; height: 20px; background: none; border: 0; cursor: pointer;
    font: 700 12px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--text);
  }
  h2.col-head { cursor: default; }
  .col-head .n {
    min-width: 20px; padding: 3px 6px; border-radius: 10px; letter-spacing: 0;
    background: color-mix(in oklab, var(--c) 30%, transparent);
  }
  .col-head .fold { color: var(--faint); font-size: 14px; letter-spacing: 0; opacity: 0; transition: opacity .12s; }
  .col-head:hover .fold, .col-head:focus-visible .fold { opacity: 1; }
  .empty { color: var(--faint); font-size: 13px; padding: 4px 2px; text-align: center; }

  /* The human's lane opens with a summary where Fizzy puts "Add a card" */
  .youbox {
    margin-bottom: 14px; padding: 16px 16px 14px; text-align: center; background: var(--card);
    border: 1.5px solid color-mix(in oklab, var(--link) 55%, var(--card)); border-radius: 4px;
    box-shadow: var(--shadow);
  }
  .youbox p { margin: 0; }
  .you-n { font: 700 18px/1.25 var(--display); letter-spacing: -0.01em; }
  .you-tally {
    display: flex; justify-content: center; flex-wrap: wrap; margin-top: 10px !important; padding-top: 10px;
    border-top: 1px solid color-mix(in oklab, var(--link) 30%, transparent);
    font: 600 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--link);
  }
  .you-tally span { padding: 0 10px; }
  .you-tally span + span { border-left: 1px solid color-mix(in oklab, var(--link) 35%, transparent); }
  .you-sub { margin-top: 6px !important; font-size: 13px; color: var(--muted); }
  .youbox.clear { border-color: color-mix(in oklab, var(--pass) 50%, var(--card)); }

  /* Cards */
  .card {
    position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
    background: color-mix(in oklab, var(--c, transparent) 7%, var(--card));
    border: 1px solid color-mix(in oklab, var(--c, var(--line)) 30%, var(--line));
    border-radius: 4px; padding: 0 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow);
    transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .card.done { opacity: .82; }
  .tab {
    display: inline-flex; align-items: center; max-width: 100%; margin: -1px 0 9px -15px; padding: 5px 9px;
    border-radius: 4px 0 4px 0; background: color-mix(in oklab, var(--c, var(--faint)) 82%, black); color: #fff;
    font: 700 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase;
  }
  .tab b { font-weight: 700; padding-right: 8px; margin-right: 8px; border-right: 1px solid rgb(255 255 255 / .45); }
  .tab span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    flex: none; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .feature { margin: 0 0 8px; font: 700 15px/1.32 var(--display); letter-spacing: -0.01em; }
  .card.has-bubble .feature { padding-right: 44px; }
  .card.has-bubble .tab { max-width: calc(100% - 34px); }
  .meta {
    display: flex; flex-wrap: wrap; margin-bottom: 6px;
    font: 600 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--link);
  }
  .meta span { padding: 0 8px 4px 0; margin-right: 8px; border-bottom: 1px solid color-mix(in oklab, var(--link) 35%, transparent); }
  .meta span + span { padding-left: 8px; margin-left: -8px; border-left: 1px solid color-mix(in oklab, var(--link) 35%, transparent); }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who { margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .prlink {
    display: block; margin-top: 10px; padding-top: 8px; border-top: 1px solid color-mix(in oklab, var(--c, var(--line-strong)) 25%, var(--line));
    font: 600 12px/1.3 var(--sans); color: var(--link); text-decoration: underline;
    text-decoration-color: color-mix(in oklab, var(--link) 40%, transparent); text-underline-offset: 3px;
    overflow-wrap: anywhere;
  }
  .prlink:hover { text-decoration-color: currentColor; }
  .prlink::after { content: " ↗"; text-decoration: none; display: inline-block; }

  /* A golden ticket: the job is waiting on the human */
  .card.golden {
    background: linear-gradient(100deg, var(--gold-mid), var(--gold-soft) 28%, var(--card) 58%, var(--gold-soft) 82%, var(--gold-mid));
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 22%, transparent), var(--shadow);
  }
  .card.golden .tab { background: none; color: var(--text); padding-left: 0; margin-left: 0; margin-top: 4px; }
  .card.golden .tab b { border-right-color: color-mix(in oklab, var(--text) 35%, transparent); }
  .card.golden .prlink { border-top-color: color-mix(in oklab, var(--gold) 45%, transparent); }
  .ask { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .cmds { display: grid; gap: 3px; min-width: 0; font-size: 12px; color: var(--muted); }
  .cmds code { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .stamp {
    flex: none; margin: 0 2px 3px 0; padding: 4px 9px 3px; transform: rotate(-6deg);
    border: 2px solid currentColor; border-radius: 6px; outline: 1px solid currentColor; outline-offset: 2px;
    font: 800 11px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; opacity: .9;
  }
  .stamp.stop { color: var(--human); } .stamp.ask { color: var(--merged); } .stamp.review { color: var(--pass); }

  /* The bubble on a card's corner: how long it has waited, or which round it is on */
  .bubble {
    position: absolute; top: -12px; right: -14px; width: 66px; height: 66px;
    filter: drop-shadow(0 2px 4px oklch(26% 0.05 264 / .18));
  }
  .bubble circle {
    fill: color-mix(in oklab, var(--c, var(--link)) 16%, var(--card));
    stroke: color-mix(in oklab, var(--c, var(--link)) 50%, var(--card)); stroke-width: 1;
  }
  .bubble text { fill: var(--text); font-family: var(--sans); }
  .bubble .arc { font-size: 6.4px; font-weight: 700; letter-spacing: 1.1px; }
  .bubble .n { font: 800 21px var(--display); }
  .card.golden .bubble { --c: var(--link); }

  /* Review rounds */
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font: 600 10px/1 var(--sans); color: var(--faint); width: 24px; }
  .chip {
    flex: 1; text-align: center; font: 700 9.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase;
    padding: 4px 0; border-radius: 4px; border: 1px dashed var(--line-strong); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in oklab, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in oklab, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .chip.judge { flex: 1.7; }
  .chip.J-APPROVE { border: 1px solid var(--pass); color: var(--pass); }
  .chip.J-BUILD, .chip.J-SPEC { border: 1px solid var(--changes); color: var(--changes); }
  .chip.J-ESCALATE { border: 1px solid var(--human); color: var(--human); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes lane-in { from { opacity: 0; transform: scaleX(.7); } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .chip.wait, .col.just { animation: none; }
    .pill, .card { transition: none; }
  }

  /* Toasts: state updates that expire; human-attention ones are highlighted */
  .toasts {
    position: fixed; top: 60px; right: 16px; z-index: 30; width: min(340px, calc(100vw - 32px));
    display: grid; gap: 8px; pointer-events: none;
  }
  .toast {
    pointer-events: auto; cursor: pointer; position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--active);
    border-radius: 8px; padding: 9px 30px 11px 12px; box-shadow: var(--shadow), 0 14px 28px -16px oklch(26% 0.05 264 / .4);
    animation: toast-in .2s ease-out;
  }
  .toast.good { border-left-color: var(--pass); }
  .toast.warn { border-left-color: var(--changes); }
  .toast.merged { border-left-color: var(--merged); }
  .toast.human {
    border: 1.5px solid var(--gold); border-left-width: 4px;
    background: linear-gradient(100deg, var(--gold-mid), var(--gold-soft) 45%, var(--card));
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 22%, transparent), var(--shadow);
  }
  .toast.human .t-title { color: var(--text); font-weight: 700; }
  .t-title { font: 600 10.5px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .t-text { font-size: 13px; line-height: 1.4; margin-top: 2px; }
  .t-x {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; background: none;
    color: var(--faint); cursor: pointer; font-size: 15px; line-height: 1; border-radius: 4px;
  }
  .t-x:hover { color: var(--text); }
  .t-bar {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: currentColor; opacity: .5;
    transform-origin: left; animation: toast-life var(--life, 8s) linear forwards; color: var(--active);
  }
  .toast.good .t-bar { color: var(--pass); } .toast.warn .t-bar { color: var(--changes); }
  .toast.merged .t-bar { color: var(--merged); } .toast.human .t-bar { color: var(--gold); opacity: 1; }
  .toast:hover .t-bar { animation-play-state: paused; }
  @keyframes toast-life { to { transform: scaleX(0); } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
  .see-all {
    display: block; margin-top: 8px; text-align: center; cursor: pointer;
    font: 600 10.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--link);
    padding: 3px 0; border-radius: 4px; border: 1px solid var(--line);
  }
  .see-all:hover, .see-all:focus-visible { border-color: var(--link); outline: none; }
  .rounds-dialog {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5, 6, 10, .6); z-index: 10; padding: 16px;
  }
  .rounds-dialog.on { display: flex; }
  .rd-box {
    width: min(460px, 100%); max-height: 85vh; display: grid; grid-template-rows: auto 1fr;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .rd-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .rd-head h3 { margin: 4px 40px 0 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .rd-body { overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 5px; align-content: start; }
  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }

  .stdout { margin: 0 32px 16px; flex: none; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .so-toggle {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; cursor: pointer;
    background: none; border: 0; border-radius: 10px; text-align: left;
    font: 700 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .so-toggle:hover, .so-toggle:focus-visible { color: var(--text); outline: none; }
  .so-toggle .chev {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--active);
    font-size: 16px; line-height: 1; transition: transform .15s, border-color .15s;
  }
  .so-toggle:hover .chev { border-color: var(--active); }
  .so-toggle .n { margin-left: auto; font-weight: 400; color: var(--faint); }
  .stdout:not(.min) .so-toggle { border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
  .stdout.min .chev { transform: rotate(-90deg); }
  .so-body { height: 24vh; min-height: 120px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .stdout.min .so-body { display: none; }
  .wt { padding: 10px 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; }
  .wt + .wt { border-top: 1px solid var(--line); }
  .wt-head { color: var(--text); }
  .wt-head .path { color: var(--faint); margin-left: 8px; }
  .wt-head .pulse { display: inline-block; margin-right: 6px; }
  .wt pre { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  .wt pre.idle { color: var(--faint); }

  footer {
    flex: none; padding: 0 32px 16px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* Shared bits for the dialogs */
  .num { font: 600 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .rd-head h3, .d-head h3, .md h1, .md h2 { font-family: var(--display); letter-spacing: -0.01em; }
  .rd-box, .drawer { box-shadow: 0 20px 60px -20px oklch(26% 0.05 264 / .45); }
  .wt-head .pulse { color: var(--active); }
  .files, .doc { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .files { overflow-x: hidden; }
  .file { overflow-wrap: anywhere; }

  @media (max-width: 640px) {
    header { padding: 14px 16px 2px; }
    .banner { margin: 10px 16px 0; }
    .col { width: min(336px, calc(100vw - 56px)); }
    .col.you { width: min(400px, calc(100vw - 32px)); }
    .stdout { margin: 0 16px 12px; }
    .board { padding: 14px 16px 16px; }
    footer { padding: 0 16px 12px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="bars" id="bars" aria-hidden="true"></span>Software Factory <span id="project-name" class="project-name">tremtec</span></h1>
  <div class="status" id="status">connecting…</div>
</header>
<div id="banner"></div>
<main class="board" id="board"></main>
<section class="stdout" id="stdout" aria-label="Running per worktree"></section>
<footer>
  <span>/factory &lt;feature&gt;</span>
  <span>/factory feedback &lt;job-id&gt; [&lt;note&gt;]</span>
  <span>/factory approve &lt;job-id&gt;</span>
  <span>/factory ship &lt;job-id&gt;</span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="rounds-dialog" id="rounds-dialog" role="dialog" aria-modal="true" aria-labelledby="rd-title">
  <div class="rd-box">
    <div class="rd-head">
      <div class="num" id="rd-num"></div>
      <h3 id="rd-title"></h3>
      <button class="close" data-close-rounds aria-label="Close">×</button>
    </div>
    <div class="rd-body" id="rd-body"></div>
  </div>
</div>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="branch" id="d-branch"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const MAX_ROUNDS = 3
const TEAM_APPROVALS = 2 // teammate approvals a PR needs before it comes back to be merged
// Lanes group the job.json stages. "you" is the human's lane: first and always open.
// To give PRs their own lane again, move 'pr' out of it into a new entry.
const LANES = [
  { key: 'you', stages: ['needs-human', 'interview', 'pick', 'merge-ready', 'pr'], label: 'Needs you' },
  { key: 'discovery', stages: ['discovery'], label: 'Discovery' },
  { key: 'prototype', stages: ['prototype'], label: 'Prototype' },
  { key: 'spec', stages: ['spec'], label: 'Spec' },
  { key: 'build', stages: ['build', 'ship'], label: 'Build' },
  { key: 'review', stages: ['review', 'judge'], label: 'Review' },
  { key: 'team', stages: ['team-review'], label: 'Team review' },
  { key: 'merged', stages: ['merged'], label: 'Merged' },
  { key: 'discarded', stages: ['discarded'], label: 'Discarded' },
]
const COLUMN = Object.fromEntries(LANES.flatMap((c) => c.stages.map((s) => [s, c.key])))
// What each human stage asks of you, most urgent first.
const ASKS = {
  'needs-human': { stamp: 'Blocked', cls: 'stop', tally: (n) => `${n} blocked` },
  interview: { stamp: 'Answer', cls: 'ask', tally: (n) => `${n} interview${n > 1 ? 's' : ''}` },
  pick: { stamp: 'Pick', cls: 'ask', tally: (n) => `${n} option${n > 1 ? 's' : ''} to pick` },
  'merge-ready': { stamp: 'Merge', cls: 'review', tally: (n) => `${n} to merge` },
  pr: { stamp: 'Review PR', cls: 'ask', tally: (n) => `${n} PR${n > 1 ? 's' : ''} to review` },
}
const ASK_ORDER = Object.keys(ASKS)
const names = (a) => a.length > 1 ? `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}` : a[0] || ''
const LIVE = new Set(['discovery', 'prototype', 'spec', 'build', 'review', 'judge', 'ship'])
const DONE = new Set(['merged', 'discarded']) // final stages: nothing runs and nothing waits
const REVIEWERS = [['product', 'prod'], ['security', 'sec'], ['code', 'code'], ['ux', 'ux'], ['ui', 'ui']]
const JUDGE = ['APPROVE', 'BUILD', 'SPEC', 'ESCALATE']

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])


// Project name injected by the factory skill bootstrap
const PROJECT_NAME = (() => {
  const el = document.getElementById('project-name')
  if (el && el.textContent) return el.textContent
  try { return localStorage.getItem('factory.projectName') || '' } catch { return '' }
})()
if (PROJECT_NAME) {
  const el = document.getElementById('project-name')
  if (el) el.textContent = `– ${PROJECT_NAME}`
  try { localStorage.setItem('factory.projectName', PROJECT_NAME) } catch {}
  document.title = `Software Factory – ${PROJECT_NAME}`
}

// Project name injected by the factory skill bootstrap
const PROJECT_NAME = (() => {
  const el = document.getElementById('project-name')
  if (el && el.textContent) return el.textContent
  try { return localStorage.getItem('factory.projectName') || '' } catch { return '' }
})()
if (PROJECT_NAME) {
  const el = document.getElementById('project-name')
  if (el) el.textContent = `– ${PROJECT_NAME}`
  try { localStorage.setItem('factory.projectName', PROJECT_NAME) } catch {}
  document.title = `Software Factory – ${PROJECT_NAME}`
}
const VISIBLE_ROUNDS = 3
const allRounds = new Map() // job id -> { title, rows } for the see-all dialog
let openRoundsId = null
let jobs = []
let lastRender = ''
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
const roundPartial = new Map() // "<job>/<n>" -> { verdicts, at } of a round with files missing
const RETRY_MS = 60000 // how often to look again for a file that was missing
const noLog = new Map() // job id -> when its activity.log was last found missing
let openJobId = null
let openPath = null
let openText = null

// python's http.server drops connections when many arrive at once: try a failed one once more.
async function get(url) {
  for (let attempt = 0; ; attempt++) {
    try {
      return await fetch(url, { cache: 'no-store' })
    } catch (err) {
      if (attempt) throw err
      await new Promise((r) => setTimeout(r, 250))
    }
  }
}

async function fetchText(url) {
  const res = await get(url)
  if (!res.ok) throw Object.assign(new Error(`${url}: HTTP ${res.status}`), { status: res.status })
  return res.text()
}

// ---- Board ---------------------------------------------------------------

function verdictOf(text) {
  const m = text.split('\n')[0].trim().match(/^VERDICT:\s*(PASS|CHANGES|APPROVE|BUILD|SPEC|ESCALATE)$/)
  return m ? m[1] : 'invalid'
}

// Earlier rounds aren't on the board; their verdicts come from the review files.
async function pastRounds(job) {
  const rounds = []
  const upto = DONE.has(job.stage) ? job.round + 1 : job.round
  for (let n = 1; n < upto; n++) {
    const key = `${job.id}/${n}`
    const partial = roundPartial.get(key)
    if (partial && Date.now() - partial.at < RETRY_MS) { rounds.push(partial.verdicts); continue }
    if (!roundCache.has(key)) {
      const verdicts = {}
      let flaky = false
      await Promise.all([...REVIEWERS.map(([k]) => [k, `review-${k}.md`]), ['judge', 'judge.md']].map(async ([k, f]) => {
        try {
          verdicts[k] = verdictOf(await fetchText(`jobs/${job.id}/round-${n}/${f}`))
        } catch (err) {
          verdicts[k] = 'missing'
          if (err.status !== 404) flaky = true // not there for now, not for sure
        }
      }))
      if (Object.values(verdicts).every((v) => v !== 'missing' && v !== 'invalid')) {
        roundCache.set(key, verdicts)
      } else {
        if (!flaky) roundPartial.set(key, { verdicts, at: Date.now() })
        rounds.push(verdicts)
        continue
      }
    }
    rounds.push(roundCache.get(key))
  }
  return rounds
}

function chips(n, verdicts, reviewing, judging) {
  const cells = REVIEWERS.map(([k, short]) => {
    const v = verdicts[k]
    const cls = v === 'PASS' || v === 'CHANGES' ? v : v === 'pending' ? (reviewing ? 'wait' : '') : 'bad'
    const label = v === 'missing' || v === 'invalid' ? `${short}?` : short
    return `<span class="chip ${cls}" title="${k}: ${esc(v)}">${label}</span>`
  }).join('')
  const j = verdicts.judge || 'pending'
  const jcls = JUDGE.includes(j) ? `J-${j}` : j === 'pending' ? (judging ? 'wait' : '') : 'bad'
  const jlabel = JUDGE.includes(j) ? j.toLowerCase() : j === 'pending' ? 'judge' : 'judge?'
  return `<div class="round"><span class="r">R${n}</span>${cells}<span class="chip judge ${jcls}" title="judge: ${esc(j)}">${jlabel}</span></div>`
}

// [n, unit] since a timestamp, for the waiting bubble.
function ago(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000))
  if (m < 60) return [m, m === 1 ? 'MINUTE' : 'MINUTES']
  const h = Math.round(m / 60)
  if (h < 48) return [h, h === 1 ? 'HOUR' : 'HOURS']
  return [Math.round(h / 24), 'DAYS']
}

// The round badge on a card's corner: a number with a word curved above and below.
function bubble(id, top, n, bottom) {
  const k = id.replace(/[^\w-]/g, '')
  return `<svg class="bubble" viewBox="0 0 64 64" role="img" aria-label="${esc(`${top} ${n} ${bottom}`.toLowerCase())}">
      <circle cx="32" cy="32" r="30.5"/>
      <path id="bt-${k}" d="M9.5 32a22.5 22.5 0 0 1 45 0" fill="none"/>
      <path id="bb-${k}" d="M4 32a28 28 0 0 0 56 0" fill="none"/>
      <text class="arc"><textPath href="#bt-${k}" startOffset="50%" text-anchor="middle">${esc(top)}</textPath></text>
      <text class="n" x="32" y="39.5" text-anchor="middle">${esc(n)}</text>
      <text class="arc"><textPath href="#bb-${k}" startOffset="50%" text-anchor="middle">${esc(bottom)}</textPath></text>
    </svg>`
}

function card(job, past) {
  const live = LIVE.has(job.stage)
  const ap = job.approvals || {}
  const by = ap.by || []
  const asked = ap.changes || []
  const need = ap.need ?? TEAM_APPROVALS
  const inTeam = job.stage === 'team-review'
  // A teammate asked for changes: the PR is back with you, for a different reason.
  const ask = job.stage === 'pr' && asked.length ? { stamp: 'Changes asked', cls: 'stop' } : ASKS[job.stage]
  if (DONE.has(job.stage) && past.length) {
    const last = past[past.length - 1]
    const known = (v) => v && v !== 'missing' && v !== 'invalid'
    past = [...past.slice(0, -1), Object.fromEntries([...REVIEWERS.map(([k]) => k), 'judge'].map((k) =>
      [k, known(last[k]) ? last[k] : (k === 'judge' ? job.judge : job.reviews?.[k]) || 'pending']))]
  }
  const rows = past.map((v, i) => chips(i + 1, v, false, false))
  if (job.round > 0 && !DONE.has(job.stage)) rows.push(chips(job.round, { ...job.reviews, judge: job.judge }, job.stage === 'review', job.stage === 'judge'))
  allRounds.set(job.id, { title: job.feature, rows })
  const shown = rows.slice(-VISIBLE_ROUNDS)
  const more = rows.length > VISIBLE_ROUNDS
    ? `<span class="see-all" role="button" tabindex="0" data-rounds="${esc(job.id)}">see all ${rows.length} rounds</span>` : ''
  const doing = job.task ? job.task : job.stage === 'ship' ? 'rebasing' : job.stage === 'judge' ? 'judge deciding' : ''
  const meta = [doing, job.cycle > 1 ? `cycle ${job.cycle}` : '', inTeam || by.length ? `${by.length} of ${need} approvals` : ''].filter(Boolean)
  const who = !inTeam ? ''
    : by.length ? `Approved by ${names(by)}. Waiting for ${Math.max(need - by.length, 0)} more.` : 'Waiting for teammates to review.'

  // Waiting on you: how long. Running: which round, and how many the cycle has left.
  let bub = ''
  if (ask && job.changed) {
    bub = bubble(job.id, 'WAITING', ...ago(job.changed))
  } else if (inTeam) {
    bub = bubble(job.id, 'APPROVED', by.length, `OF ${need}`)
  } else if (live && job.round > 0) {
    const left = Number.isFinite(job.cycleStart) ? job.cycleStart + MAX_ROUNDS - 1 - job.round : null
    bub = bubble(job.id, 'ROUND', job.round, left === null ? '' : left > 0 ? `${left} LEFT` : 'LAST ONE')
  }

  const pr = /^https?:\/\//.test(job.pr || '')
    ? `<a class="prlink" href="${esc(job.pr)}" target="_blank" rel="noopener" title="Open the pull request">${esc(job.pr.replace(/^https?:\/\/(www\.)?github\.com\//, ''))}</a>` : ''
  const how = job.stage === 'needs-human'
    ? `<code>/factory feedback ${esc(job.id)} …</code><code>/factory ship ${esc(job.id)}</code>`
    : job.stage === 'pr' && asked.length
      ? `<span>${esc(names(asked))} asked for changes.</span><code>/factory feedback ${esc(job.id)}</code>`
    : job.stage === 'pr' ? `<code>/factory approve ${esc(job.id)}</code><code>/factory feedback ${esc(job.id)}</code>`
    : job.stage === 'merge-ready' ? `<span>Approved by ${esc(names(by))}. Merging is yours.</span>`
    : job.stage === 'interview' ? '<span>Answer in the session that runs this job.</span>'
    : job.stage === 'pick' ? '<span>Pick an option in the session that runs this job.</span>' : ''
  const [num, ...slug] = job.id.split('-')
  return `
    <div class="card ${ask ? 'golden' : ''} ${live ? 'live' : ''} ${DONE.has(job.stage) ? 'done' : ''} ${bub ? 'has-bubble' : ''}"
         role="button" tabindex="0" data-job="${esc(job.id)}">
      ${bub}
      <div class="tab">${live ? '<span class="pulse" aria-label="running"></span>' : ''}<b>${esc(num)}</b><span>${esc(slug.join('-'))}</span></div>
      <p class="feature">${esc(job.feature)}</p>
      ${meta.length ? `<div class="meta">${meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      <div class="branch">${esc(job.branch)}</div>
      ${who ? `<div class="who">${esc(who)}</div>` : ''}
      ${rows.length ? `<div class="rounds">${shown.join('')}</div>${more}` : ''}
      ${pr}
      ${ask ? `<div class="ask"><div class="cmds">${how}</div><span class="stamp ${ask.cls}">${ask.stamp}</span></div>` : ''}
    </div>`
}

// What each worktree is doing. The orchestrator appends a line to
// jobs/<id>/activity.log at every spawn and finish; without one, derive a line.
const TAIL = 6
const activityCache = new Map()
function derived(job) {
  if (job.stage === 'review') {
    const wait = Object.entries(job.reviews || {}).filter(([, v]) => v === 'pending').map(([k]) => k)
    return `review round ${job.round}: ${wait.length ? 'waiting on ' + wait.join(', ') : 'all in'}`
  }
  if (job.stage === 'build') return `build: ${job.task || ''}`
  if (job.stage === 'interview') return 'waiting for your answers'
  if (job.stage === 'pick') return 'waiting for you to pick a prototype'
  if (job.stage === 'needs-human') return 'blocked, waiting for you'
  if (job.stage === 'pr') return 'PR open, waiting for your review'
  if (job.stage === 'team-review') return `team review: ${(job.approvals?.by || []).length} of ${job.approvals?.need ?? TEAM_APPROVALS} approvals`
  if (job.stage === 'merge-ready') return 'approved by the team, waiting for you to merge'
  return job.stage
}
let stdoutMin = true // collapsed unless the viewer opened it before
try { stdoutMin = localStorage.getItem('factory.stdoutMin') !== '0' } catch {}
function setStdoutMin(v) {
  stdoutMin = v
  try { localStorage.setItem('factory.stdoutMin', v ? '1' : '0') } catch {}
  $('stdout').classList.toggle('min', v)
  const b = document.querySelector('[data-toggle-stdout]')
  if (b) b.setAttribute('aria-expanded', String(!v))
}
async function renderStdout() {
  $('stdout').classList.toggle('min', stdoutMin)
  const open = jobs.filter((j) => !DONE.has(j.stage))
  const blocks = await Promise.all(open.map(async (job) => {
    let lines = []
    if (Date.now() - (noLog.get(job.id) || 0) > RETRY_MS) {
      try { lines = (await fetchText(`jobs/${job.id}/activity.log`)).trim().split('\n').filter(Boolean).slice(-TAIL) }
      catch (err) { if (err.status === 404) noLog.set(job.id, Date.now()) }
    }
    const live = LIVE.has(job.stage)
    const body = lines.length ? lines.join('\n') : derived(job)
    return `<div class="wt"><div class="wt-head">${live ? '<span class="pulse" aria-label="running"></span>' : ''}${esc(job.id)}<span class="path">${esc(job.worktree || '')}</span></div>
      <pre class="${live ? '' : 'idle'}">${esc(body)}</pre></div>`
  }))
  const html = open.length
    ? `<button class="so-toggle" data-toggle-stdout aria-expanded="${!stdoutMin}"><span class="chev">▾</span>What each worktree is running<span class="n">${open.length}</span></button><div class="so-body">${blocks.join('')}</div>`
    : ''
  if (html !== activityCache.get('html')) {
    const keep = document.querySelector('.so-body')?.scrollTop || 0
    activityCache.set('html', html)
    $('stdout').innerHTML = html
    const body = document.querySelector('.so-body')
    if (body) body.scrollTop = keep
  }
  $('stdout').hidden = !open.length
}

// Which pipeline lanes are open. The human's lane always is.
let openLanes = new Set()
try { openLanes = new Set(JSON.parse(localStorage.getItem('factory.openLanes') || '[]')) } catch {}
let justOpened = null
async function toggleLane(key) {
  if (openLanes.has(key)) openLanes.delete(key)
  else openLanes.add(key)
  justOpened = openLanes.has(key) ? key : null
  try { localStorage.setItem('factory.openLanes', JSON.stringify([...openLanes])) } catch {}
  await render()
  document.querySelector(`[data-lane="${key}"]`)?.focus()
}

function youLane(items) {
  const n = items.length
  const tally = ASK_ORDER
    .map((stage) => [items.filter((x) => x.job.stage === stage).length, ASKS[stage].tally])
    .filter(([count]) => count)
    .map(([count, say]) => `<span>${say(count)}</span>`).join('')
  const box = n
    ? `<p class="you-n">${n} ${n === 1 ? 'job needs' : 'jobs need'} you</p><p class="you-tally">${tally}</p>`
    : `<p class="you-n">Nothing needs you</p>
       <p class="you-sub">The agents are working. A job lands here when it has a question, gets blocked or opens a PR.</p>`
  return `
    <section class="col you" aria-label="Needs you">
      <h2 class="col-head"><span class="name">Needs you</span></h2>
      <div class="youbox ${n ? '' : 'clear'}">${box}</div>
      ${items.map((x) => x.html).join('')}
    </section>`
}

function lane(l, items) {
  const n = items.length
  if (!openLanes.has(l.key)) {
    return `
    <div class="pillcol c-${l.key}">
      <button class="pill ${n ? '' : 'none'}" data-lane="${l.key}" style="--n:${Math.min(n, 10)}" aria-expanded="false"
              title="${esc(n ? items.map((x) => x.job.id).join('\n') : 'No jobs')}">
        <span class="n">${n}</span><span class="name">${l.label}</span>
      </button>
      <span class="thread"></span>
    </div>`
  }
  return `
    <section class="col c-${l.key} ${justOpened === l.key ? 'just' : ''}" aria-label="${l.label}">
      <button class="col-head" data-lane="${l.key}" aria-expanded="true" title="Collapse ${l.label}">
        <span class="name">${l.label}</span><span class="n">${n}</span><span class="fold" aria-hidden="true">×</span>
      </button>
      ${items.map((x) => x.html).join('') || '<div class="empty">No jobs here right now.</div>'}
    </section>`
}

async function render() {
  const problems = []
  const byLane = Object.fromEntries(LANES.map((l) => [l.key, []]))
  const pasts = await Promise.all(jobs.map(pastRounds))
  jobs.forEach((job, i) => {
    if (!COLUMN[job.stage]) problems.push(`Job ${job.id} has unknown stage "${job.stage}"`)
    else byLane[COLUMN[job.stage]].push({ job, html: card(job, pasts[i]) })
  })
  // Newest first in a lane. In the human's lane the most urgent ask comes first.
  for (const l of LANES) byLane[l.key].reverse()
  byLane.you.sort((a, b) => ASK_ORDER.indexOf(a.job.stage) - ASK_ORDER.indexOf(b.job.stage))

  const html = `<div class="lanes">${LANES.map((l) => l.key === 'you' ? youLane(byLane.you) : lane(l, byLane[l.key])).join('')}</div>`
  const most = Math.max(1, ...LANES.map((l) => l.key === 'you' ? 0 : byLane[l.key].length))
  const bars = LANES.filter((l) => l.key !== 'you')
    .map((l) => `<i class="c-${l.key}" style="--h:${Math.round(3 + 13 * byLane[l.key].length / most)}px"></i>`).join('')
  justOpened = null
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  if (html + bars + banner !== lastRender) {
    lastRender = html + bars + banner
    $('board').innerHTML = html
    $('bars').innerHTML = bars
    $('banner').innerHTML = banner
  }
}

function paintRounds() {
  const entry = openRoundsId && allRounds.get(openRoundsId)
  if (!entry) return closeRounds()
  $('rd-num').textContent = `${openRoundsId} · ${entry.rows.length} rounds`
  $('rd-title').textContent = entry.title
  $('rd-body').innerHTML = entry.rows.join('')
}
function openRounds(id) {
  openRoundsId = id
  paintRounds()
  $('rounds-dialog').classList.add('on')
}
function closeRounds() {
  openRoundsId = null
  $('rounds-dialog').classList.remove('on')
}

// ---- Toasts --------------------------------------------------------------

const TOAST_MS = 8000
const HUMAN_TOAST_MS = 30000
const MAX_TOASTS = 5
let seen = null // job id -> last stage/judge; null until the first poll

function toast(job, kind, text) {
  const box = $('toasts')
  const el = document.createElement('div')
  el.className = `toast ${kind}`
  el.dataset.job = job.id
  el.style.setProperty('--life', (kind === 'human' ? HUMAN_TOAST_MS : TOAST_MS) + 'ms')
  el.innerHTML = `<div class="t-title">${kind === 'human' ? 'your call · ' : ''}${esc(job.id)}</div>
    <div class="t-text">${esc(text)}</div>
    <button class="t-x" data-dismiss aria-label="Dismiss">×</button><div class="t-bar"></div>`
  el.querySelector('.t-bar').addEventListener('animationend', () => el.remove())
  box.appendChild(el)
  while (box.children.length > MAX_TOASTS) box.firstChild.remove()
}

function stageToast(job, from) {
  switch (job.stage) {
    case 'interview': return ['human', 'discovery needs you: answer, confirm or decide']
    case 'pick': return ['human', 'prototype options are ready: pick one']
    case 'needs-human': return ['human', `blocked, waiting for you. /factory feedback ${job.id} … or /factory ship ${job.id}`]
    case 'team-review': return ['info', `in team review: waiting for ${job.approvals?.need ?? TEAM_APPROVALS} teammate approvals`]
    case 'merge-ready': return ['human', `approved by ${names(job.approvals?.by || [])}: ready for you to merge`]
    case 'pr':
      if (job.approvals?.changes?.length) return ['human', `${names(job.approvals.changes)} asked for changes. /factory feedback ${job.id}`]
      return ['human', `PR is open, waiting for your review${job.pr ? ': ' + job.pr.replace(/^https?:\/\/(www\.)?github\.com\//, '') : ''}`]
    case 'merged': return ['merged', 'PR merged']
    case 'discarded': return ['info', 'discarded by the human']
    case 'review': return ['info', `review round ${job.round} started`]
    case 'build': return ['info', `building${job.task ? ': ' + job.task : ''}`]
    default: return ['info', `${from} → ${job.stage}`]
  }
}

function notify(list) {
  const next = new Map(list.map((j) => [j.id, { stage: j.stage, judge: j.judge, round: j.round, ok: (j.approvals?.by || []).length }]))
  if (seen) {
    for (const job of list) {
      const was = seen.get(job.id)
      if (!was) { toast(job, 'info', `started: ${job.feature}`); continue }
      if (was.stage !== job.stage || (job.stage === 'review' && was.round !== job.round)) {
        toast(job, ...stageToast(job, was.stage))
      } else if (job.stage === 'team-review' && next.get(job.id).ok > was.ok) {
        toast(job, 'good', `${names(job.approvals.by)} approved: ${next.get(job.id).ok} of ${job.approvals.need ?? TEAM_APPROVALS}`)
      }
      if (job.judge !== was.judge && ['APPROVE', 'BUILD', 'SPEC', 'ESCALATE'].includes(job.judge)) {
        toast(job, job.judge === 'APPROVE' ? 'good' : job.judge === 'ESCALATE' ? 'human' : 'warn', `judge: ${job.judge.toLowerCase()} (round ${job.round})`)
      }
    }
  } else {
    // First load: surface whatever is already waiting for the human.
    for (const job of list) if (ASKS[job.stage]) toast(job, ...stageToast(job, ''))
  }
  seen = next
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    notify(jobs)
    await render()
    await renderStdout()
    if (openRoundsId) paintRounds()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// Each orchestrator session writes only its own jobs/<id>/job.json.
async function loadJobs() {
  const doc = new DOMParser().parseFromString(await fetchText('jobs/'), 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => {
    const res = await get(`jobs/${id}/job.json`)
    if (!res.ok) throw new Error(`jobs/${id}/job.json: HTTP ${res.status}`)
    const job = JSON.parse(await res.text())
    // The orchestrator rewrites job.json on every change, so this is "in this state since".
    const changed = Date.parse(res.headers.get('last-modified') || '')
    if (!Number.isNaN(changed)) job.changed = changed
    return job
  }))
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

function fileRank(path) {
  const order = ['discovery.md', 'answers.md', 'spec.md', 'build.md', 'pr.md']
  if (order.includes(path)) return [0, order.indexOf(path), path]
  if (path.startsWith('prototypes/')) return [0, 1.5, path]
  const review = path.match(/^round-(\d+)\/review-(\w+)\.md$/)
  if (review) return [2, Number(review[1]) * 10 + REVIEWERS.findIndex(([k]) => k === review[2]), path]
  const judge = path.match(/^round-(\d+)\/judge\.md$/)
  if (judge) return [2, Number(judge[1]) * 10 + 9, path]
  return [1, 0, path] // feedback-<k>.md and anything else
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*(PASS|APPROVE)|STATUS:\s*READY|GATE:\s*GO)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*(CHANGES|BUILD|SPEC)|GATE:\s*REFINE)$/.test(first)) return 'warn'
  if (/^(VERDICT:\s*ESCALATE|STATUS:\s*BLOCKED|GATE:\s*NO-GO)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''}`
  $('d-title').textContent = job.feature
  $('d-branch').textContent = job.branch

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  await Promise.all(files.filter((f) => !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">The discoverer hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  const x = e.target.closest('[data-dismiss]')
  if (x) { x.closest('.toast').remove(); return }
  if (e.target.closest('a[href]')) return // a real link (the PR on a card): let it open
  if (e.target.closest('[data-toggle-stdout]')) return setStdoutMin(!stdoutMin)
  const laneEl = e.target.closest('[data-lane]')
  if (laneEl) return toggleLane(laneEl.dataset.lane)
  const roundsEl = e.target.closest('[data-rounds]')
  if (roundsEl) { e.stopPropagation(); return openRounds(roundsEl.dataset.rounds) }
  if (e.target.closest('[data-close-rounds]') || e.target === $('rounds-dialog')) return closeRounds()
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return openRoundsId ? closeRounds() : closeDrawer()
  const t = e.target.closest && e.target.closest('[data-rounds]')
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return openRounds(t.dataset.rounds) }
  // Cards are divs (they hold a link), so give them the keys a button has.
  if (e.target.matches && e.target.matches('.card[data-job]') && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault()
    openDrawer(e.target.dataset.job)
  }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) { html += `<div class="verdict ${t}">${esc(first)}</div>`; i = 1 }

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
setInterval(poll, POLL_MS)
</script>
